<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Documents</title>
<style>
    body {
        font-family: system-ui, sans-serif;
        max-width: 700px;
        margin: 60px auto;
        padding: 0 20px;
        line-height: 1.6;
        color: #222;
        background: #fafafa;
    }
    h1 {
        font-weight: 500;
        font-size: 1.8rem;
        margin-bottom: 1rem;
    }
    ul {
        list-style: none;
        padding: 0;
    }
    li {
        margin: 0.6rem 0;
    }
    a {
        text-decoration: none;
        color: #0050a0;
    }
    a:hover {
        text-decoration: underline;
    }
</style>
</head>
<body>

<h1>Documents disponibles</h1>

<ul>
{% for file in site.static_files %}
  {% if file.extname == ".pdf" %}
    <li><a href="{{ file.path | relative_url }}">{{ file.name }}</a></li>
  {% endif %}
{% endfor %}
</ul>

</body>
</html>
